<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Thoughts — Om Mehta</title>
  <meta name="description" content="Om Mehta's blog — notes on finance, school, and everything in between." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            base: 'rgb(var(--color-base) / <alpha-value>)',
            surface: 'rgb(var(--color-surface) / <alpha-value>)',
            surface2: 'rgb(var(--color-surface2) / <alpha-value>)',
            hairline: 'rgb(var(--color-hairline) / <alpha-value>)',
            ink: 'rgb(var(--color-ink) / <alpha-value>)',
            muted: 'rgb(var(--color-muted) / <alpha-value>)',
            gold: 'rgb(var(--color-gold) / <alpha-value>)',
            gain: 'rgb(var(--color-gain) / <alpha-value>)',
          },
          fontFamily: {
            display: ['"Fraunces"', 'serif'],
            sans: ['"Inter"', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'monospace'],
          },
        },
      },
    }
  </script>

  <script>
    (function () {
      var stored = localStorage.getItem('om-theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      if (theme === 'light') document.documentElement.classList.add('light');
      if (localStorage.getItem('om-reduced-motion') === 'true') {
        document.documentElement.classList.add('no-motion');
      }
    })();
  </script>

  <style>
    :root {
      --color-base: 18 22 29;
      --color-surface: 26 32 41;
      --color-surface2: 31 39 51;
      --color-hairline: 42 49 64;
      --color-ink: 236 238 243;
      --color-muted: 139 147 163;
      --color-gold: 176 141 87;
      --color-gain: 76 140 107;
    }
    html.light {
      --color-base: 247 246 242;
      --color-surface: 255 255 255;
      --color-surface2: 241 239 234;
      --color-hairline: 222 219 210;
      --color-ink: 24 27 33;
      --color-muted: 101 105 116;
      --color-gold: 150 111 53;
      --color-gain: 47 110 79;
    }
    html { scroll-behavior: smooth; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
    }
    html.no-motion {
      scroll-behavior: auto !important;
    }
    html.no-motion * {
      animation-duration: 0s !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0s !important;
      transform: none !important;
    }
    html.no-motion .reveal {
      opacity: 1 !important;
      transform: none !important;
    }
    html.no-motion .card-hover:hover {
      transform: none !important;
    }

    .reveal { opacity: 0; transform: translateY(16px); transition: opacity 0.7s ease, transform 0.7s ease; }
    .reveal.is-visible { opacity: 1; transform: translateY(0); }
    .card-hover { transition: transform 0.35s ease, border-color 0.35s ease; }
    .card-hover:hover { transform: translateY(-4px); border-color: rgb(var(--color-gold)); }
    ::selection { background: rgb(var(--color-gold)); color: rgb(var(--color-base)); }
    :focus-visible { outline: 2px solid rgb(var(--color-gold)); outline-offset: 3px; }
    .post-body p { margin-bottom: 1.1em; line-height: 1.75; }
    .hidden-view { display: none; }
    .theme-toggle-icon { transition: opacity 0.2s ease, transform 0.3s ease; }

    /* ----- FIXED TOP NAV – all monospace ----- */
    #main-nav {
      overflow: visible !important;
      width: 96%;
      max-width: 480px;
    }
    #main-nav > div {
      flex-wrap: nowrap !important;
      padding: 0.375rem 0.5rem !important;
    }
    #main-nav .nav-inner {
      flex: 1 1 auto;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.05rem;
      font-size: 8px;
      letter-spacing: 0.04em;
      font-family: 'IBM Plex Mono', monospace;
    }
    @media (min-width: 480px) {
      #main-nav .nav-inner { font-size: 9px; gap: 0.1rem; }
    }
    @media (min-width: 640px) {
      #main-nav .nav-inner { font-size: 10px; gap: 0.15rem; }
    }
    @media (min-width: 1024px) {
      #main-nav .nav-inner { font-size: 11px; gap: 0.2rem; }
    }
    #main-nav .nav-inner a {
      padding: 0.3rem 0.5rem;
      border-radius: 999px;
      white-space: nowrap;
      transition: color 0.2s;
      font-family: inherit;
    }
    #main-nav .nav-inner a:last-child {
      padding-left: 0.6rem;
      padding-right: 0.6rem;
      border: 1px solid rgb(var(--color-hairline));
      background: rgba(var(--color-surface2), 0.4);
    }
    #main-nav .om-link {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.05em;
      padding-left: 0.5rem;
      padding-right: 0.5rem;
    }
    @media (max-width: 380px) {
      #main-nav .nav-inner a { font-size: 7px !important; padding: 0.2rem 0.3rem !important; }
      #main-nav .nav-inner a:last-child { padding: 0.2rem 0.4rem !important; }
    }
    /* end nav fix */
  </style>
</head>

<body class="bg-base text-ink font-sans antialiased">

  <!-- THEME & MOTION TOGGLES -->
  <div class="fixed top-5 right-5 z-50 flex flex-col gap-2 items-end">
    <button id="theme-toggle" aria-label="Toggle light and dark theme" class="w-10 h-10 rounded-full border border-hairline bg-surface/80 backdrop-blur-md flex items-center justify-center hover:border-gold transition-colors">
      <svg id="icon-sun" class="theme-toggle-icon w-4 h-4 text-gold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
      </svg>
      <svg id="icon-moon" class="theme-toggle-icon w-4 h-4 text-gold hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
    <button id="motion-toggle" aria-label="Disable animations and transitions" class="w-10 h-10 rounded-full border border-hairline bg-surface/80 backdrop-blur-md flex items-center justify-center hover:border-gold transition-colors text-xs font-mono text-muted">
      <span id="motion-icon" class="text-[11px]">⟳</span>
    </button>
  </div>

  <!-- FLOATING PILL NAV (all monospace) -->
  <nav id="main-nav" class="fixed top-5 left-1/2 -translate-x-1/2 z-50">
    <div class="flex items-center justify-between rounded-full border border-hairline bg-surface/80 backdrop-blur-md shadow-[0_8px_30px_rgba(0,0,0,0.35)]">
      <a href="index.html" class="om-link text-gold whitespace-nowrap">← OM</a>
      <div class="nav-inner">
        <a href="index.html" class="hover:text-ink transition-colors">Home</a>
        <a href="index.html#contact" class="hover:text-ink transition-colors">Contact</a>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <header class="px-6 sm:px-10 lg:px-20 pt-32 pb-16">
    <div class="max-w-3xl mx-auto">
      <p class="font-mono text-[11px] tracking-[0.25em] text-gold uppercase mb-6">Om Mehta — My Thoughts</p>
      <h1 class="font-display text-4xl sm:text-5xl leading-tight text-ink mb-5">Notes as I go.</h1>
      <p class="text-muted text-base sm:text-lg leading-relaxed">
        A running log of what I'm learning, thinking about, and working through — finance, school, and everything in between.
      </p>
    </div>
  </header>

  <!-- CATEGORY FILTER -->
  <div class="px-6 sm:px-10 lg:px-20 pb-4">
    <div class="max-w-3xl mx-auto flex flex-wrap gap-2" id="tag-filter"></div>
  </div>

  <!-- POST LIST -->
  <main id="post-list-view" class="px-6 sm:px-10 lg:px-20 pb-16">
    <div class="max-w-3xl mx-auto" id="post-list"></div>
  </main>

  <!-- SINGLE POST VIEW -->
  <main id="post-view" class="px-6 sm:px-10 lg:px-20 pb-16 hidden-view">
    <div class="max-w-3xl mx-auto">
      <button id="back-to-list" class="font-mono text-[11px] text-muted hover:text-gold transition-colors uppercase tracking-widest mb-10">← All posts</button>
      <p id="post-date" class="font-mono text-[11px] text-gold uppercase tracking-widest mb-3"></p>
      <h1 id="post-title" class="font-display text-3xl sm:text-4xl text-ink mb-4 leading-tight"></h1>
      <div id="post-tags" class="flex flex-wrap gap-2 mb-8"></div>
      <div id="post-body" class="post-body text-muted text-base"></div>
    </div>
  </main>

  <footer class="border-t border-hairline px-6 sm:px-10 lg:px-20 py-10">
    <div class="max-w-3xl mx-auto flex flex-col sm:flex-row justify-between gap-2 text-xs font-mono text-muted">
      <p>© 2026 Om Mehta.</p>
      <a href="index.html" class="hover:text-gold transition-colors">Back to the main site →</a>
    </div>
  </footer>

  <script>
    // --- Categories ---
    var TAGS = ["Finance", "Career & Internships", "Leadership", "Life & Interests"];
    var posts = [  {
    id: "falling-into-balance",
    date: "Sep 1, 2026",
    title: "Falling Into Balance",
    tags: ["Life & Interests"],
    body: [
      "Work-life balance is a funny thing. It's something that many will mention, and they'll say it's essential for sustaining yourself—and to their credit, it is. But I am finding it's not so much a conscious choice in the moment, as much as something you fall into. I'm currently a full-time student, working 20 hours a week, and also meeting all my personal wants, from self-development to just free time. People ask me where I find the time. The reality is, I don't need to; I simply have the time.",
      "No doubt, part of it is the careful organization of those repetitive duties: the laundry, the cleaning, the homework. But a big part is the passion. I am, in some way or another, passionate about everything I spend my time on, and with that, I always have time to do the things I need to.",
      "Some things I love less, some things I love more, some are easier to love, some are harder. But I find that everything has something to be excited about, and that makes it that much easier to \"find that time.\" Obviously, there will always be obligations we'd rather avoid. But I've found that you can discover a reason to appreciate even the tedious things—sometimes, the joy is just in finishing them. When you operate with that mindset, balance stops being something you have to force, and becomes something you just live."
    ]
  },];
    var activeTag = 'All';

    function renderTagFilter() {
      var bar = document.getElementById('tag-filter');
      var all = ['All'].concat(TAGS);
      bar.innerHTML = '';
      all.forEach(function (tag) {
        var btn = document.createElement('button');
        btn.textContent = tag;
        btn.className = 'font-mono text-[10.5px] uppercase tracking-widest px-3.5 py-2 rounded-full border transition-colors ' +
          (tag === activeTag
            ? 'border-gold text-ink bg-surface2'
            : 'border-hairline text-muted hover:text-ink hover:border-gold');
        btn.addEventListener('click', function () {
          activeTag = tag;
          renderTagFilter();
          renderPostList();
        });
        bar.appendChild(btn);
      });
    }

    function renderPostList() {
      var list = document.getElementById('post-list');
      list.innerHTML = '';
      var visible = posts.filter(function (p) {
        return p.pinned || activeTag === 'All' || (p.tags || []).indexOf(activeTag) !== -1;
      });
      if (visible.length === 0) {
        list.innerHTML = '<p class="text-muted text-sm font-mono">No posts yet.</p>';
        return;
      }
      visible.forEach(function (post) {
        var tagChips = (post.tags || []).map(function (t) {
          return '<span class="text-[10px] font-mono uppercase tracking-widest text-gold border border-gold/40 rounded-full px-2.5 py-1">' + t + '</span>';
        }).join('');
        var pinnedChip = post.pinned
          ? '<span class="text-[10px] font-mono uppercase tracking-widest text-ink bg-gold rounded-full px-2.5 py-1">Start Here</span>'
          : '';
        var card = document.createElement('a');
        card.href = '#' + post.id;
        card.className = 'reveal block border border-hairline rounded-2xl p-7 card-hover mb-5';
        card.innerHTML =
          '<div class="flex items-center justify-between flex-wrap gap-3 mb-3">' +
            '<p class="font-mono text-[11px] text-muted uppercase tracking-widest">' + post.date + '</p>' +
            '<div class="flex flex-wrap gap-2">' + pinnedChip + tagChips + '</div>' +
          '</div>' +
          '<h2 class="font-display text-2xl text-ink mb-3">' + post.title + '</h2>' +
          '<p class="text-muted text-sm leading-relaxed">' + post.body[0] + '</p>' +
          '<p class="font-mono text-[11px] text-gold uppercase tracking-widest mt-5">Read the post →</p>';
        card.addEventListener('click', function (e) {
          e.preventDefault();
          openPost(post.id);
        });
        list.appendChild(card);
      });
      requestAnimationFrame(function () {
        document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('is-visible'); });
      });
    }

    function openPost(id) {
      var post = posts.filter(function (p) { return p.id === id; })[0];
      if (!post) return;
      document.getElementById('post-list-view').classList.add('hidden-view');
      document.getElementById('post-view').classList.remove('hidden-view');
      document.getElementById('post-date').textContent = post.date;
      document.getElementById('post-title').textContent = post.title;
      var tagsEl = document.getElementById('post-tags');
      tagsEl.innerHTML = (post.tags || []).map(function (t) {
        return '<span class="text-[10px] font-mono uppercase tracking-widest text-gold border border-gold/40 rounded-full px-2.5 py-1">' + t + '</span>';
      }).join('');
      var bodyEl = document.getElementById('post-body');
      bodyEl.innerHTML = '';
      post.body.forEach(function (para) {
        var p = document.createElement('p');
        p.textContent = para;
        bodyEl.appendChild(p);
      });
      window.scrollTo({ top: 0, behavior: 'auto' });
      history.replaceState(null, '', '#' + post.id);
    }

    function closePost() {
      document.getElementById('post-view').classList.add('hidden-view');
      document.getElementById('post-list-view').classList.remove('hidden-view');
      history.replaceState(null, '', window.location.pathname);
    }

    document.getElementById('back-to-list').addEventListener('click', closePost);

    renderTagFilter();
    renderPostList();

    var initialHash = window.location.hash.replace('#', '');
    if (initialHash && posts.some(function (p) { return p.id === initialHash; })) {
      openPost(initialHash);
    }

    // Theme toggle
    var themeBtn = document.getElementById('theme-toggle');
    var iconSun = document.getElementById('icon-sun');
    var iconMoon = document.getElementById('icon-moon');
    function reflectIcon() {
      var isLight = document.documentElement.classList.contains('light');
      iconSun.classList.toggle('hidden', isLight);
      iconMoon.classList.toggle('hidden', !isLight);
    }
    reflectIcon();
    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        var isLight = document.documentElement.classList.toggle('light');
        localStorage.setItem('om-theme', isLight ? 'light' : 'dark');
        reflectIcon();
      });
    }
    var systemPref = window.matchMedia('(prefers-color-scheme: light)');
    systemPref.addEventListener('change', function (e) {
      if (localStorage.getItem('om-theme')) return;
      document.documentElement.classList.toggle('light', e.matches);
      reflectIcon();
    });

    // Motion toggle
    var motionBtn = document.getElementById('motion-toggle');
    var motionIcon = document.getElementById('motion-icon');
    function reflectMotion() {
      var isReduced = document.documentElement.classList.contains('no-motion');
      motionIcon.style.opacity = isReduced ? '0.5' : '1';
    }
    reflectMotion();
    if (motionBtn) {
      motionBtn.addEventListener('click', function () {
        var isReduced = document.documentElement.classList.toggle('no-motion');
        localStorage.setItem('om-reduced-motion', String(isReduced));
        reflectMotion();
        if (isReduced) {
          document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('is-visible'); });
        }
      });
    }
  </script>
</body>
</html>
